name: Deploy Worker a Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configurar secretos runtime del Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEV_SUPER_CODE: ${{ secrets.DEV_SUPER_CODE }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CF_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CF_ACCOUNT_ID"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Falta VITE_SUPABASE_ANON_KEY para validar JWT en el Worker"; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY" || { echo "Falta SUPABASE_SERVICE_KEY para operaciones administrativas del Worker"; exit 1; }
          test -n "$DEV_SUPER_CODE" || { echo "Falta DEV_SUPER_CODE para el acceso de desarrollador"; exit 1; }

          # Los 3 bindings existen ya como vars planas en el dashboard (era
          # deploy.sh). Error 10053 = binding ocupado: se tolera porque el
          # runtime funciona con los valores vigentes (ver INC-003). Si algun
          # dia se rotan, borrarlos primero en el dashboard.
          for pair in "SUPABASE_ANON_KEY:SUPABASE_ANON_KEY" "SUPABASE_SERVICE_KEY:SUPABASE_SERVICE_KEY" "DEV_SUPER_CODE:DEV_SUPER_CODE"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if ! printf '%s' "${!val}" | npx wrangler secret put "$name" 2>&1 | tee /tmp/put.log | grep -q '10053'; then
              continue
            fi
            echo "::warning::${name} ya existe como binding no-secreto en el dashboard; se conserva el valor vigente (ver INC-003)"
          done

      - name: Deploy a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
