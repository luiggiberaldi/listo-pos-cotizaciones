name: Deploy Worker a Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >-
            deploy --config wrangler.jsonc
            --var SUPABASE_SERVICE_KEY:"${{ secrets.SUPABASE_SERVICE_KEY }}"
            --var VAPID_PUBLIC_KEY:"${{ secrets.VAPID_PUBLIC_KEY }}"
            --var VAPID_PRIVATE_KEY:"${{ secrets.VAPID_PRIVATE_KEY }}"
            --var GROQ_KEYS_A:"${{ secrets.GROQ_KEYS_A }}"
            --var GROQ_KEYS_B:"${{ secrets.GROQ_KEYS_B }}"
            --var GROQ_KEYS_C:"${{ secrets.GROQ_KEYS_C }}"
