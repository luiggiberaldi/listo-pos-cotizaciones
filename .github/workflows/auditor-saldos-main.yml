name: Auditor de saldos — principal

on:
  schedule:
    # 02:00 Venezuela (06:00 UTC), una hora después del E2E nocturno de staging.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditor-saldos-main
  cancel-in-progress: false

jobs:
  auditor:
    name: Replay del ledger vs columnas (solo lectura)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIN_PROJECT_REF: oyfyuszgjwcepjpngclv
      MAIN_SUPABASE_ACCESS_TOKEN: ${{ secrets.MAIN_SUPABASE_ACCESS_TOKEN }}
      MAIN_ALERT_WEBHOOK: ${{ secrets.MAIN_ALERT_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sin npm ci: el auditor es Node puro (fetch + fs), cero dependencias.

      - name: Validar secretos del principal
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAIN_SUPABASE_ACCESS_TOKEN" || { echo 'Falta MAIN_SUPABASE_ACCESS_TOKEN'; exit 1; }

      - name: Auditor de saldos (replay del ledger, solo lectura)
        run: node scripts/auditor-saldos-main.mjs

      - name: Alertar divergencia por webhook opcional
        if: ${{ failure() && env.MAIN_ALERT_WEBHOOK != '' }}
        continue-on-error: true
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' > /tmp/auditor-alert.json
          import json
          import os
          message = (
              '❌ Auditor de saldos: clientes divergentes en el principal\n'
              f"Run: {os.environ['RUN_URL']}\n"
              'Acción: revisar el reporte del run y reparar con el script con guardas '
              '(NO auto-reparar).'
          )
          print(json.dumps({'text': message, 'content': message}))
          PY
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/auditor-alert.json \
            "$MAIN_ALERT_WEBHOOK"

      - name: Resumen si está consistente
        if: ${{ success() }}
        shell: bash
        run: echo 'Auditor OK — columnas == ledger en toda la base del principal.'
