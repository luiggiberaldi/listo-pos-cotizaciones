name = "listo-pos-cotizaciones"
main = "./worker.js"
compatibility_date = "2024-12-01"
workers_dev = true

[triggers]
crons = ["0 3 * * *"]

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"
remote = true

[vars]
SUPABASE_URL = "https://oyfyuszgjwcepjpngclv.supabase.co"

# Configure these bindings outside this file before deploying:
# - SUPABASE_ANON_KEY: Cloudflare secret or protected environment binding.
# - SUPABASE_SERVICE_KEY: Cloudflare secret; never commit it as a plain-text var.
# - DEV_SUPER_CODE: Cloudflare secret; never commit it as a plain-text var.
# Local development loads `.dev.vars` automatically via Wrangler.
# See docs/plans/2026-08-23-paquete-release-principal-comisiones.md.
